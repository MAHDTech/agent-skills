[workspace]
resolver = "2"
members = [
    "crates/skills-core",
    "crates/skills-tui",
    "crates/ask-cli",
]
default-members = ["crates/ask-cli"]

[workspace.package]
version = "0.1.55"
edition = "2024"
authors = ["MAHDTech"]
license = "MIT"
repository = "https://github.com/MAHDTech/agent-skills"
homepage = "https://github.com/MAHDTech/agent-skills"
readme = "README.md"

[workspace.dependencies]
# Internal workspace crates
skills-core = { path = "crates/skills-core", version = "0.1.55" }
skills-tui = { path = "crates/skills-tui", version = "0.1.55" }

# Serialization and data models
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
chrono = { version = "0.4.45", features = ["serde"] }
typed-builder = "0.23.2"

# Async runtime and networking
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
futures = "0.3.34"

# CLI and Terminal UI
clap = { version = "4.6.7", features = ["derive", "cargo", "env"] }
ratatui = { version = "0.30.2", features = ["all-widgets", "crossterm"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
comfy-table = "8.0.1"
colored = "3.1.1"
color-eyre = "0.6.5"

# Logging and Diagnostics
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# Error Handling
thiserror = "2.0.21"
anyhow = "1.0.104"

# Filesystem and System Utilities
walkdir = "2.5.0"
dirs = "7.0.0"
sha2 = "0.11.1"

# Test and Development Dependencies
assert_cmd = "2.2.2"
cargo-crap = "0.9.0"
predicates = "3.1.4"
tempfile = "3.27.0"
wiremock = "0.6.5"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "warn"
assert_is_empty = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 0
debug = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
