# lychee configuration file - link checker

# Accept status codes from hosts that block/deny automated checkers.
accept = ["200..=299", "403", "406", "429"]

# Retry transient network/server errors before marking a link broken.
max_retries = 2
retry_wait_time = 2

# Skip loopback/link-local/private IPs (localhost example URLs in templates).
exclude_loopback = true

# Paths lychee should not check at all (anchored regexes; mirrored in devenv.nix
# git-hooks.hooks.lychee.excludes so prek does not pass excluded files as CLI inputs):
#   - skills/vendor/**                          : managed upstream vendor snapshots
#   - skills(-archive)?/tooling/opencode-acp/** : vendored third-party docs (agentclientprotocol.com)
#   - skills(-archive)?/**/resources/auto/**    : downloaded third-party documentation
#   - dashboard/**                              : Zola site; links resolve at build time
#   - .out-of-scope/**                          : example/placeholder content
#   - *.lock                                    : package and environment lockfiles
exclude_path = [
  '^(\./)?skills/vendor/',
  '^(\./)?skills(-archive)?/tooling/opencode-acp/',
  '^(\./)?skills(-archive)?/.*/resources/auto/',
  '^(\./)?dashboard/',
  '^(\./)?\.out-of-scope/',
  '\.lock$',
]

# URL patterns to ignore (regex):
exclude = [
  "http://127.0.0.1.*",
  "https://10.0.0.10.*",
  "http://localhost.*",
  "https://blocked-site.com.*",
  '.*\$.*',           # any URL with a literal $ = shell/template placeholder in code, not a real link
  '.*skills\.sh.*',   # TODO: remove once the repo is published/indexed on skills.sh (404s until then)
]
