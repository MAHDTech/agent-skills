# Use the CNAME for the Base URL.
base_url = "https://skills.mahdtech.com/"
title = "Agent Skills"
description = "A collection of AI agent skills"
theme = "tars-dashboards"
output_dir = "public"
# Skill documentation contains literal template and GitHub Actions examples.
skip_content_templating = ["**/*.md"]

[link_checker]
internal_level = "warn"

[markdown]
insert_anchor_links = "heading"
render_emoji = true
smart_punctuation = true

[markdown.highlighting]
theme = "one-dark-pro"

[extra]
author = "MAHDTech"
github = "https://github.com/MAHDTech/agent-skills"
# Branch that "View source" links point at.
github_branch = "trunk"
website = "https://mahdtech.com"
logo_path = "/images/logo.svg"
install_command = "npx skills add MAHDTech/agent-skills"

# Header navigation. `external` items open in a new tab.
[[extra.menu_items]]
name = "Skills"
url = "/skills/"

[[extra.menu_items]]
name = "Blog"
url = "https://mahdtech.com"
external = true

[[extra.menu_items]]
name = "GitHub"
url = "https://github.com/MAHDTech/agent-skills"
external = true
