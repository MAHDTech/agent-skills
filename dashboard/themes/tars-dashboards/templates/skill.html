{% extends "base.html" %}

{# A skill is a section (SKILL.md becomes _index.md) so its reference files can
   be pages beneath it. The layout is shared with page.html through ui.doc. #}
{% block top_overlay %}
  <div class="reading-progress" aria-hidden="true"></div>
{% endblock top_overlay %}

{% block content %}
  {{ <ui.doc node={section} extra={config.extra} is_skill={true} /> }}
{% endblock content %}
