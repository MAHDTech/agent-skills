{% extends "base.html" %}

{% block content %}
<div class="prose max-w-none" data-pagefind-body>
  <h1 class="!text-3xl !mb-2" style="color: var(--color-primary)">{{ section.title }}</h1>

  {% if config.description is defined %}
    <p style="color: var(--color-muted)" class="!text-base !mt-0">{{ config.description }}</p>
  {% endif %}

  <hr>

  {{ section.content | safe }}

  {{ <render_children section={section} /> }}
</div>
{% endblock content %}
