---
name: CI

on:
  pull_request:
    branches:
      - trunk
      - main
  push:
    branches:
      - trunk
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: CI Validation
    uses: tars-cloud/actions/.github/workflows/consumer-devenv-ci.yaml@53e74ce24b0b16306c57f66786a85122904406e5 # v3.7.0
    with:
      job-name: validate
      lint-command: prek run --all-files
