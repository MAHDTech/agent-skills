---
name: CI

on:
  pull_request:
    branches:
      - trunk
      - main
  push:
    branches:
      - trunk
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: CI Validation
    uses: tars-cloud/actions/.github/workflows/consumer-devenv-ci.yaml@2ff528f5c523bbdfabd988e6c3b12fd0fa50a7e0 # v3.13.3
    with:
      job-name: validate
      lint-command: prek run --all-files
      test-command: ./scripts/run-tests.sh
      cleanup-android: true
      cleanup-dotnet: true
      cleanup-haskell: true
      cleanup-boost: true
      cleanup-swift: true
