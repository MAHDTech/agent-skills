---
name: CI

on:
  pull_request:
    branches:
      - trunk
      - main
  push:
    branches:
      - trunk
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: CI Validation
    uses: tars-cloud/actions/.github/workflows/consumer-devenv-ci.yaml@a39f4a8dec126d41daa8dcec6b075e9acf81fdab # v3.8.1
    with:
      job-name: validate
      lint-command: prek run --all-files
      cleanup-android: true
      cleanup-dotnet: true
      cleanup-haskell: true
      cleanup-boost: true
      cleanup-swift: true
