---
name: Cargo CRAP

on:
  pull_request:
    branches:
      - trunk
      - main
  push:
    branches:
      - trunk
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: cargo-crap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-crap:
    name: Cargo CRAP
    uses: tars-cloud/actions/.github/workflows/consumer-cargo-crap.yaml@26ffb67cc8d374672f646d6dd8829befa844b0e9 # v3.12.0
    with:
      baseline-branch: trunk
      coverage-tool: llvm-cov
      post-comment: true
      update-records-pr: true
    secrets:
      client-id: ${{ secrets.APP_CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
