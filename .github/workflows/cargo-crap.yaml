---
name: Cargo CRAP

on:
  pull_request:
    branches:
      - trunk
      - main
  push:
    branches:
      - trunk
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: cargo-crap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-crap:
    name: Cargo CRAP
    uses: tars-cloud/actions/.github/workflows/consumer-cargo-crap.yaml@a39f4a8dec126d41daa8dcec6b075e9acf81fdab # v3.8.1
    with:
      baseline-branch: trunk
      coverage-tool: llvm-cov
      post-comment: true
      update-records-pr: false
