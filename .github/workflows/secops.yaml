---
name: SecOps

on:
  push:
    branches:
      - trunk
      - main
  pull_request:
    branches:
      - trunk
      - main
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: secops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------
  # Trivy Scan
  # -------------------------------------------------
  trivy:
    name: Trivy Scan
    uses: tars-cloud/actions/.github/workflows/consumer-trivy.yaml@53e74ce24b0b16306c57f66786a85122904406e5 # v3.7.0
    with:
      timeout-minutes: 60
      config-file: auto

  # -------------------------------------------------
  # CodeQL Analysis
  # -------------------------------------------------
  codeql:
    name: CodeQL Analysis
    uses: tars-cloud/actions/.github/workflows/consumer-codeql.yaml@53e74ce24b0b16306c57f66786a85122904406e5 # v3.7.0
    with:
      type: devenv
      timeout-minutes: 120
      languages: '["actions", "rust"]'
      config-file: auto
