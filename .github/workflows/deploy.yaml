---
name: Deploy Dashboard

on:
  push:
    branches:
      - trunk
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy Dashboard
    runs-on: ubuntu-24.04
    steps:
      - id: setup_project
        name: Set Up Project
        uses: tars-cloud/actions/composite/setup-project@e237e0ca8fbf31df927e9418d6b94dd81a462a35 # v4.0.0
        with:
          fetch-depth: 0
          s3-endpoint: ${{ vars.TARS_CLOUD_S3_ENDPOINT }}
          s3-bucket: ${{ vars.TARS_CLOUD_S3_BUCKET }}
          s3-region: ${{ vars.TARS_CLOUD_S3_REGION }}
          s3-access-key: ${{ secrets.TARS_CLOUD_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.TARS_CLOUD_S3_SECRET_ACCESS_KEY }}

      - id: build_dashboard
        name: Build Dashboard
        uses: tars-cloud/actions/composite/run-devenv@e237e0ca8fbf31df927e9418d6b94dd81a462a35 # v4.0.0
        with:
          run: ask dashboard build

      - id: upload_pages_artifact
        name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dashboard/public
          include-hidden-files: true

      - id: deploy_to_gh_pages
        name: Deploy to GH Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - id: report_status
        name: Report Deployment Status
        if: always()
        uses: tars-cloud/actions/composite/report-status@e237e0ca8fbf31df927e9418d6b94dd81a462a35 # v4.0.0
        with:
          title: Deployment Results
          results: |
            build-dashboard=${{ steps.build_dashboard.outcome }}
            deploy-pages=${{ steps.deploy_to_gh_pages.outcome }}
