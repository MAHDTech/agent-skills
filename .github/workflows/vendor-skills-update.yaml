---
name: Skills Update

on:
  schedule:
    # Weekly, Monday 02:00 UTC.
    - cron: "0 2 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: vendor-skills-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Set Up Consumer
        uses: tars-cloud/actions/composite/setup-consumer@253eb09c3b4249a2f4adb70f8a6e87203129e4e2 # v3.15.0
        with:
          fetch-depth: 0

      - name: Create Update Token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Refresh Vendor Snapshots and Documentation
        uses: tars-cloud/actions/composite/run-devenv@253eb09c3b4249a2f4adb70f8a6e87203129e4e2 # v3.15.0
        with:
          run: |
            ask skills download-resources \
              --pending-ref refs/remotes/origin/automation/vendor-skills \
              > "$RUNNER_TEMP/vendor-update.md"
            cat "$RUNNER_TEMP/vendor-update.md" >> "$GITHUB_STEP_SUMMARY"
            ask dashboard build

      - name: Validate Catalog
        uses: tars-cloud/actions/composite/run-devenv@253eb09c3b4249a2f4adb70f8a6e87203129e4e2 # v3.15.0
        with:
          run: |
            prek run --all-files
            ./scripts/run-tests.sh

      - name: Create or Refresh Update PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.token.outputs.token }}
          branch: automation/vendor-skills
          base: ${{ github.event.repository.default_branch }}
          title: "chore(skills): Update vendor skills and documentation"
          commit-message: "chore(skills): refresh vendor snapshots and documentation"
          body-path: ${{ runner.temp }}/vendor-update.md
          add-paths: |
            skills/vendor/
            skills/*/resources/auto/
            README.md
            agents/AGENTS.md
            skills.sh.json
            dashboard/content/
