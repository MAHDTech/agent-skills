name: CI

on:
  pull_request:
    branches:
      - trunk
      - main

permissions:
  contents: read
  statuses: write
  # actions: write is required by setup-devenv to delete/purge old nix caches
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

      - id: prek_run
        name: Run pre-commit hooks
        run: |
          devenv shell --verbose -- prek run -a

      - id: devenv_test
        name: Devenv test
        run: |
          devenv test

      - id: report_status
        name: Report Status
        if: always()
        uses: ./.github/actions/report-status
        with:
          result: ${{ job.status }}
          success-message: "CI validation passed"
          failure-message: "CI validation failed"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workflow-name: ${{ github.workflow }}
          repository: ${{ github.repository }}
          sha: ${{ github.sha }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - id: write_summary
        name: Write Results Summary
        if: always()
        uses: ./.github/actions/step-summary
        with:
          title: "CI Results"
          jobs: |
            Setup Devenv|${{ steps.setup_devenv.outcome }}
            Run pre-commit hooks|${{ steps.prek_run.outcome }}
            Devenv test|${{ steps.devenv_test.outcome }}
