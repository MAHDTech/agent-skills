name: CI

on:
  pull_request:
    branches:
      - trunk
      - main

permissions:
  contents: read
  pull-requests: read
  actions: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

      - id: run_lint
        name: Run Lint
        shell: devenv shell --quiet bash -- -e {0}
        run: skills-lint

      - id: build_dashboard
        name: Build Dashboard
        uses: ./.github/actions/build-dashboard

      - id: report_status
        name: Report Status
        if: always()
        uses: ./.github/actions/report-status
        with:
          result: ${{ job.status }}
          success-message: "CI validation passed"
          failure-message: "CI validation failed"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workflow-name: ${{ github.workflow }}
          repository: ${{ github.repository }}
          sha: ${{ github.sha }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - id: write_summary
        name: Write Results Summary
        if: always()
        uses: ./.github/actions/step-summary
        with:
          title: "CI Results"
          jobs: |
            Setup Devenv|${{ steps.setup_devenv.outcome }}
            Run Lint|${{ steps.run_lint.outcome }}
            Build Dashboard|${{ steps.build_dashboard.outcome }}
