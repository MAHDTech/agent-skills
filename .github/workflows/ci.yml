---
name: CI

on:
  pull_request:
    branches:
      - trunk
      - main
  push:
    branches:
      - trunk
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: CI Validation
    uses: tars-cloud/actions/.github/workflows/consumer-devenv-ci.yaml@d074dde42c3d810959a57df78516e3eddb2fa8f7 # v3
    with:
      job-name: validate
      lint-command: prek run --all-files
