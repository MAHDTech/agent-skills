---
name: CodeQL

on:
  pull_request:
    branches:
      - main
      - trunk
  push:
    branches:
      - main
      - trunk
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL Analysis
    uses: tars-cloud/actions/.github/workflows/consumer-codeql.yaml@e36c5d93a66a395db6d01c32fdf3c67b6eaca0d2 # v3
    with:
      type: devenv
      timeout-minutes: 120
      languages: '["actions", "rust"]'
      config-file: auto
