name: Deploy Dashboard

on:
  push:
    branches:
      - trunk
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - id: build_dashboard
        name: Build Dashboard
        uses: ./.github/actions/build-dashboard

      - id: deploy_to_gh_pages
        name: Deploy to GH Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard/public

      - id: write_summary
        name: Write Results Summary
        if: always()
        uses: ./.github/actions/step-summary
        with:
          title: "Deployment Results"
          jobs: |
            Build Dashboard|${{ steps.build_dashboard.outcome }}
            Deploy to GH Pages|${{ steps.deploy_to_gh_pages.outcome }}
          footer: |
            ### 📦 Live Site
            Successfully deployed to [GitHub Pages](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)
