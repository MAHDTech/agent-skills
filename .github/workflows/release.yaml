---
name: Rust Release

on:
  push:
    branches:
      - trunk
      - main
  workflow_dispatch: {}

concurrency:
  group: rust-release
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  candidate:
    name: Resolve Release Candidate
    uses: tars-cloud/actions/.github/workflows/consumer-rust-release-candidate.yaml@822009e983b73316cbf67a3606842502c7be4599 # v3.3.0
    with:
      commit-sha: ${{ github.sha }}

  prepare:
    name: Prepare Release PR
    needs: candidate
    if: needs.candidate.outputs.prepare-ready == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - id: checkout
        name: Check Out the Exact Consumer Commit and Release History
        uses: tars-cloud/actions/composite/setup-consumer/scripts/checkout@822009e983b73316cbf67a3606842502c7be4599 # v3.3.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - id: release
        name: Prepare the Rust Release
        uses: tars-cloud/actions/composite/release-rust@822009e983b73316cbf67a3606842502c7be4599 # v3.3.0
        with:
          command: prepare
          commit-sha: ${{ github.sha }}
          github-token: ${{ github.token }}

  artifacts:
    name: Describe Release Artifacts
    needs: candidate
    if: needs.candidate.outputs.release-ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - id: manifest
        name: Write the Explicit Empty Asset Manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
          RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.candidate.outputs.commit-sha }}
        run: |
          printf '{"schema":1,"version":"%s","tag":"%s","commit_sha":"%s","assets":[],"reference_artifacts":[]}\n' \
            "$RELEASE_VERSION" "$RELEASE_TAG" "$RELEASE_COMMIT" > release-manifest.json

      - id: upload
        name: Upload the Release Manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish:
    name: Publish Rust Release
    needs:
      - candidate
      - artifacts
    if: needs.candidate.outputs.release-ready == 'true'
    permissions:
      contents: write
      pull-requests: read
      actions: read
    uses: tars-cloud/actions/.github/workflows/consumer-rust-release-publish.yaml@822009e983b73316cbf67a3606842502c7be4599 # v3.3.0
    with:
      commit-sha: ${{ needs.candidate.outputs.commit-sha }}
      artifact-run-id: ${{ github.run_id }}
      release-manifest-artifact: release-manifest
