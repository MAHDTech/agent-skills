---
name: Report Status
description: Report CI status to the GitHub commit status API.

inputs:
  result:
    description: "Outcome of the step to check (e.g. steps.build.outcome)"
    required: true
  success-message:
    description: "Message when the step succeeded"
    required: true
  failure-message:
    description: "Message when the step failed"
    required: true
  github-token:
    description: "GitHub token for API calls"
    required: true
  workflow-name:
    description: "Workflow name for the status context"
    required: true
  repository:
    description: "Repository in owner/repo format"
    required: true
  sha:
    description: "Commit SHA to report status on"
    required: true
  run-url:
    description: "URL to the workflow run"
    required: true

runs:
  using: composite
  steps:
    - id: report_status
      name: Report Status
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_RESULT: ${{ inputs.result }}
        INPUT_SUCCESS_MESSAGE: ${{ inputs.success-message }}
        INPUT_FAILURE_MESSAGE: ${{ inputs.failure-message }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_SHA: ${{ inputs.sha }}
        INPUT_WORKFLOW_NAME: ${{ inputs.workflow-name }}
        INPUT_RUN_URL: ${{ inputs.run-url }}
      run: |
        if [[ "${INPUT_RESULT}" == "success" ]]; then
          RESULT="success"
          DESCRIPTION="${INPUT_SUCCESS_MESSAGE}"
        else
          RESULT="failure"
          DESCRIPTION="${INPUT_FAILURE_MESSAGE}"
        fi
        if ! ERR_MSG=$(gh api \
          repos/"${INPUT_REPOSITORY}"/statuses/"${INPUT_SHA}" \
          -f state="${RESULT}" \
          -f context="${INPUT_WORKFLOW_NAME}" \
          -f description="${DESCRIPTION}" \
          -f target_url="${INPUT_RUN_URL}" 2>&1 >/dev/null); then

          echo "Failed to report CI status: $ERR_MSG"

          case "$ERR_MSG" in
            *403*|*"Resource not accessible by integration"*|*Forbidden*)
              echo "::warning::Status reporting failed due to insufficient permissions."
              exit 0
              ;;
            *)
              exit 1
              ;;
          esac
        fi
