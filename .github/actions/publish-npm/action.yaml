name: "Publish npm Package"
description: "Publish an npm package inside Devenv."

inputs:
  dry-run:
    description: "Perform a dry run without actually publishing"
    required: false
    default: "false"
  version:
    description: "Package version to publish (e.g. v0.2.2 or 0.2.2)"
    required: true
  provenance:
    description: "Enable npm provenance (requires public repo + OIDC)"
    required: false
    default: "false"
  working-directory:
    description: "Directory containing the package.json"
    required: false
    default: "."

outputs:
  version:
    description: "Published package version"
    value: ${{ steps.verify_package.outputs.version }}
  published:
    description: "Whether the package was actually published (false for dry run)"
    value: ${{ steps.publish_npm.outputs.published }}

runs:
  using: "composite"
  steps:
    - id: set_version
      name: Set Package Version
      shell: devenv shell --quiet bash -- -e {0}
      run: |
        cd ${{ inputs.working-directory }}
        VERSION="${{ inputs.version }}"
        VERSION="${VERSION#v}"  # Strip leading 'v' if present
        echo "Setting package version to ${VERSION}"
        bun version "${VERSION}" --no-git-tag-version --allow-same-version

    - id: install_deps
      name: Install Dependencies
      shell: devenv shell --quiet bash -- -e {0}
      run: |
        cd ${{ inputs.working-directory }}
        bun install

    - id: build_package
      name: Build Package
      shell: devenv shell --quiet bash -- -e {0}
      run: |
        cd ${{ inputs.working-directory }}
        bun run build

    - id: verify_package
      name: Verify Package Contents
      shell: devenv shell --quiet bash -- -e {0}
      run: |
        cd ${{ inputs.working-directory }}

        # Get version
        VERSION="$(jq -r .version package.json)"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

        # Show what will be published
        echo "Package contents:"
        npm pack --dry-run

    - id: publish_npm
      name: Publish to npm
      shell: devenv shell --quiet bash -- -e {0}
      run: |
        cd ${{ inputs.working-directory }}
        PROVENANCE_FLAG=""
        if [[ "${{ inputs.provenance }}" == "true" ]]; then
          PROVENANCE_FLAG="--provenance"
          echo "Provenance enabled (public repo + OIDC)"
        fi

        if [[ "${{ inputs.dry-run }}" == "true" ]]; then
          echo "Performing dry run..."
          npm publish --dry-run
          echo "published=false" >> "$GITHUB_OUTPUT"
        else
          echo "Publishing to npm..."
          npm publish --access public ${PROVENANCE_FLAG:-}
          echo "published=true" >> "$GITHUB_OUTPUT"
        fi
