name: Build Dashboard
description: Build the Zola dashboard inside devenv.

runs:
  using: composite
  steps:
    - id: sync_skills
      name: Sync Skills
      shell: bash
      run: devenv shell sync-skills

    - id: build_css
      name: Build CSS
      shell: bash
      run: devenv shell build-css

    - id: build_zola
      name: Build Zola
      shell: bash
      run: devenv shell build-dashboard
