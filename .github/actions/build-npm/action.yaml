name: "Build npm Package"
description: "Build a TypeScript/npm library inside Devenv."

inputs:
  working-directory:
    description: "Directory containing the package.json"
    required: false
    default: "."
  build-script:
    description: "npm run script to execute for building"
    required: false
    default: "build"

outputs:
  version:
    description: "Package version"
    value: ${{ steps.get_version.outputs.version }}
  artifact_path:
    description: "Path to built artifacts"
    value: "${{ inputs.working-directory }}/dist"

runs:
  using: "composite"
  steps:
    - id: install_deps
      name: Install Dependencies
      shell: devenv shell --quiet bash -- -e {0}
      run: |
        cd ${{ inputs.working-directory }}
        bun install

    - id: build_library
      name: Build Library
      shell: devenv shell --quiet bash -- -e {0}
      run: |
        cd ${{ inputs.working-directory }}
        bun run ${{ inputs.build-script }}

    - id: get_version
      name: Get Version
      shell: devenv shell --quiet bash -- -e {0}
      run: |
        cd ${{ inputs.working-directory }}
        VERSION="$(jq -r .version package.json)"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "Built package@${VERSION}"
